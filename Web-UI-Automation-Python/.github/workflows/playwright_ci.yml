name: Playwright Cross-Browser Test Suite

on:
  push:
    branches: [ main, master ]
  repository_dispatch:
    types: [ecommerce_deployed]
  workflow_dispatch:

jobs:
  run-playwright-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Testing Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Frameworks
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright pytest-html

      - name: Initialize Playwright Virtual Browser Binaries
        run: playwright install --with-deps

      - name: Execute 9 Cross-Browser Core Tests (Headless Cloud)
        run: |
          python -m pytest test_ui_login.py -v --html=ui_report.html --self-contained-html

      # --- THIS IS WHAT GOES AT THE BOTTOM OF THE PLAYWRIGHT FILE ---
      - name: Upload Test Report Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-report
          path: ui_report.html

